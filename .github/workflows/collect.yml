name: 리스크지표 수집(CSV 갱신)

on:
  schedule:
    - cron: "0 0 5 * *"   # 매월 5일 09:00(한국시간)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 데이터 수집
        run: python collect_data.py
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
      - name: 분석 및 전망 계산
        run: python analyze_data.py
      - name: AI 분석 리포트 생성
        run: python generate_ai_report.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}        
      - name: 결과 저장(커밋)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "리스크지표 데이터 갱신"
          git pull --rebase origin main
          git push origin HEAD:main
